### Resume [ resume ]
resume:
  title: "Resume"
  subtitle: "my <b>Story</b>"
  bg_title: "History"

  education:
    title: "Education"
    items:
      - name: "한국폴리텍 강서캠퍼스"
        subname: "사이버보안과"
        period: "2022 - 2026"
        text: "사이버 보안에 대해 여러 이론과 기술을 배우며 여러가지 보안 도구와 네트워크 시뮬레이션 등을 활용한 실습을 통해 학습을 했습니다"
    

  experience:
    title: "Experience"
    items:
      - name: "FusionDev"
        subname: "융합 프로젝트"
        period: "2025 - <b>Present</b>"
        text: "OWASP Top 10에 포함되는 주요 웹 취약점인 SQL Injection, XSS, CSRF 등 10개의 대표적인 웹 취약점을 자동으로 탐지하고 공격할 수 있으며 효과적으로 탐지하고 
          분석할 수 있는 자동화된 모의해킹 도구를 개발하는 중입니다."


